# Egern Profile
# 从 Clash enhance_proxy_group.yaml 转换
# ⚠️  请将所有 YOUR_SUBSCRIPTION_URL 替换为你的实际订阅链接

policy_groups:
  # ========== 全量订阅基础组（external 类型，拉取所有节点）==========
  - external:
      name: "全部节点"
      type: select
      urls:
        - "YOUR_SUBSCRIPTION_URL"
      filter: "(?i)^(?!.*(Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置)).*$"
      update_interval: 86400
      icon: "https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Available.png"

  # ========== 全局自动测速 ==========
  - auto_test:
      name: AUTO
      policies:
        - 全部节点
      flatten: true
      filter: "(?i)^(?!.*(Traffic|Expire|Premium|⁻|频道|订阅|ISP|流量|到期|重置)).*$"
      interval: 600
      tolerance: 100
      icon: "https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Urltest.png"

  # ========== 手动选择 ==========
  - select:
      name: 手动选择
      policies:
        - AUTO
        - 全部节点
      flatten: true
      filter: "(?i)^(?!.*(Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置)).*$"
      icon: "https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Available.png"

  # ========== 地区自动测速组 ==========
  - auto_test:
      name: HK AUTO
      policies:
        - 全部节点
      flatten: true
      filter: "(?i)^(?!.*(GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置)).*(?:HK|香港|港|Hong Kong).*$"
      interval: 600
      tolerance: 100
      icon: "https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/HK.png"

  - auto_test:
      name: JP AUTO
      policies:
        - 全部节点
      flatten: true
      filter: "(?i)^(?!.*(GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置)).*(?:JP|日本|日|JAPAN).*$"
      interval: 600
      tolerance: 100
      icon: "https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/JP.png"

  - auto_test:
      name: TW AUTO
      policies:
        - 全部节点
      flatten: true
      filter: "(?i)^(?!.*(GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置)).*(?:TW|台湾|台|tai).*$"
      interval: 600
      tolerance: 100
      icon: "https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/TW.png"

  - auto_test:
      name: SG AUTO
      policies:
        - 全部节点
      flatten: true
      filter: "(?i)^(?!.*(GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置)).*(?:SG|新加坡|新|sin).*$"
      interval: 600
      tolerance: 100
      icon: "https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/SG.png"

  - auto_test:
      name: US AUTO
      policies:
        - 全部节点
      flatten: true
      filter: "(?i)^(?!.*(GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置)).*(?:US|美国|美|American).*$"
      interval: 600
      tolerance: 100
      icon: "https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/US.png"

  - auto_test:
      name: KR AUTO
      policies:
        - 全部节点
      flatten: true
      filter: "(?i)^(?!.*(GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置)).*(?:KR|韩国|韩|首尔).*$"
      interval: 600
      tolerance: 100
      icon: "https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/KR.png"

  - auto_test:
      name: Asia AUTO
      policies:
        - HK AUTO
        - JP AUTO
        - TW AUTO
        - SG AUTO
        - KR AUTO
      interval: 600
      tolerance: 100
      icon: "https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/Static.png"

  # ========== 关键词筛选自动测速组 ==========
  - auto_test:
      name: OpenAI
      policies:
        - 全部节点
      flatten: true
      filter: "(?i)^(?!.*(Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置)).*(?:openai|chatgpt|gpt).*$"
      interval: 600
      tolerance: 100
      icon: "https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/OpenAI.png"

  - auto_test:
      name: Gemini
      policies:
        - 全部节点
      flatten: true
      filter: "(?i)^(?!.*(Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置)).*(?:gemini|\bGM\b).*$"
      interval: 600
      tolerance: 100
      icon: "https://testingcf.jsdelivr.net/gh/sinspired/proxy-rules@main/ico/Gemini.png"

  - auto_test:
      name: Youtube
      policies:
        - 全部节点
      flatten: true
      filter: "(?i)^(?!.*(Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置)).*(?:youtube|YT|流媒体).*$"
      interval: 600
      tolerance: 100
      icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png"

  - auto_test:
      name: Twitter优选
      policies:
        - 全部节点
      flatten: true
      filter: "(?i)^(?!.*(Traffic|Expire|Premium|⁻|频道|订阅|ISP|流量|到期|重置)).*(?:\bX\b|twitter).*$"
      interval: 600
      tolerance: 100
      icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Twitter.png"

  # ========== TikTok 地区筛选组 ==========
  - auto_test:
      name: TIKTOK-US
      policies:
        - 全部节点
      flatten: true
      filter: "(?i)^(?!.*(Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置)).*(?:TK|tiktok).*(?:US|TK-US).*$"
      interval: 600
      tolerance: 100
      icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/TikTok.png"

  - auto_test:
      name: TIKTOK-JP
      policies:
        - 全部节点
      flatten: true
      filter: "(?i)^(?!.*(Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置)).*(?:TK|tiktok).*(?:JP|TK-JP).*$"
      interval: 600
      tolerance: 100
      icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/TikTok.png"

  - auto_test:
      name: TIKTOK-VN
      policies:
        - 全部节点
      flatten: true
      filter: "(?i)^(?!.*(Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置)).*(?:TK|tiktok).*(?:VN|TK-VN).*$"
      interval: 600
      tolerance: 100
      icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/TikTok.png"

  - auto_test:
      name: TIKTOK-SG
      policies:
        - 全部节点
      flatten: true
      filter: "(?i)^(?!.*(Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置)).*(?:TK|tiktok).*(?:SG|TK-SG).*$"
      interval: 600
      tolerance: 100
      icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/TikTok.png"

  - auto_test:
      name: TIKTOK-TW
      policies:
        - 全部节点
      flatten: true
      filter: "(?i)^(?!.*(Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置)).*(?:TK|tiktok).*(?:TW|TK-TW).*$"
      interval: 600
      tolerance: 100
      icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/TikTok.png"

  # ========== TikTok 入口 ==========
  - select:
      name: TikTok
      policies:
        - TIKTOK-VN
        - TIKTOK-US
        - TIKTOK-JP
        - TIKTOK-SG
        - TIKTOK-TW
      icon: "https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/TikTok.png"

  # ========== AI 聚合 ==========
  - select:
      name: AI
      policies:
        - OpenAI
        - Gemini
        - AUTO
      icon: "https://testingcf.jsdelivr.net/gh/sinspired/proxy-rules@main/ico/AI.png"

  # ========== 顶层策略组 ==========
  - select:
      name: PROXY
      policies:
        - AUTO
        - Asia AUTO
        - HK AUTO
        - JP AUTO
        - TW AUTO
        - SG AUTO
        - US AUTO
        - AI
        - TikTok
        - Youtube
        - Gemini
        - Twitter优选
        - 手动选择
      icon: "https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Static.png"

  - select:
      name: Google
      policies:
        - PROXY
        - Youtube
        - AUTO
        - HK AUTO
        - JP AUTO
        - US AUTO
        - TW AUTO
        - SG AUTO
      icon: "https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Google.png"

  - select:
      name: Twitter
      policies:
        - Twitter优选
        - OpenAI
        - Gemini
        - PROXY
        - AUTO
        - HK AUTO
        - JP AUTO
        - US AUTO
        - TW AUTO
        - SG AUTO
      icon: "https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Twitter.png"

  - select:
      name: Bing
      policies:
        - DIRECT
        - PROXY
        - AI
        - AUTO
      icon: "https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Bing.png"

  - select:
      name: Spotify
      policies:
        - US AUTO
        - HK AUTO
        - JP AUTO
        - TW AUTO
        - SG AUTO
        - PROXY
        - DIRECT
      icon: "https://testingcf.jsdelivr.net/gh/sinspired/proxy-rules@main/ico/Spotify.png"

  - select:
      name: Telegram
      policies:
        - HK AUTO
        - JP AUTO
        - US AUTO
        - TW AUTO
        - SG AUTO
        - AUTO
        - PROXY
      icon: "https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Telegram.png"

