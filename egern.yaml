# ---- 规则 ----
rules:
  - rule_set:
      match: lan
      policy: DIRECT

  - rule_set:
      match: private
      policy: DIRECT

  - rule_set:
      match: unBanAD
      policy: DIRECT

  - rule_set:
      match: ban_ad
      policy: REJECT

  - rule_set:
      match: ban_program_ad
      policy: REJECT

  - rule_set:
      match: tiktok
      policy: TikTok

  - rule_set:
      match: tiktok_external
      policy: TikTok

  - rule_set:
      match: youtube
      policy: Youtube

  - rule_set:
      match: gemini
      policy: Gemini

  - rule_set:
      match: openai
      policy: OpenAI

  - rule_set:
      match: claude
      policy: AI

  - rule_set:
      match: bing
      policy: Bing

  - rule_set:
      match: copilot
      policy: AI

  - rule_set:
      match: cloudflare_cn
      policy: DIRECT

  - rule_set:
      match: cloudflare
      policy: OpenAI

  - rule_set:
      match: twitter
      policy: Twitter

  - rule_set:
      match: steam
      policy: PROXY

  - rule_set:
      match: spotify
      policy: Spotify

  - rule_set:
      match: OneDrive
      policy: PROXY

  - rule_set:
      match: telegram_domain
      policy: Telegram

  - rule_set:
      match: google_domain
      policy: Google

  - rule_set:
      match: geolocation_not_cn
      policy: PROXY

  - rule_set:
      match: cn_domain
      policy: DIRECT

  - rule_set:
      match: NetEaseMusic
      policy: DIRECT

  - rule_set:
      match: Download
      policy: DIRECT

  - rule_set:
      match: telegram_ip
      policy: Telegram

  - rule_set:
      match: google_ip
      policy: Google

  - rule_set:
      match: cn_ip
      policy: DIRECT

  - geoip:
      match: CN
      policy: DIRECT

  - default:
      policy: PROXY
